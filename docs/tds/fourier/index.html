<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Comparez la FFT et la RFFT de signaux réels et explorez leurs spectres d’amplitude et de phase."
    />
    <title>TDS - Transformée de Fourier</title>
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg" />
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/theme.css" />
    <link rel="stylesheet" href="../../shared/styles/course-header.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <link rel="stylesheet" href="./styles/fourier.css?v=20261106-tds3" />
  </head>
  <body>
    <course-header
      page-title="Transformée de Fourier"
      course-code="TDS"
      course-name="Traitement du signal"
      instructor="Robin Condat"
    ></course-header>
    <main>
      <div class="signal-layout">
        <div class="charts-workspace">
          <article class="chart-panel signal-panel">
            <div class="chart-heading"><h2>Signal composé</h2></div>
            <div class="chart-stage" id="timeStage"
              ><canvas id="timeChart"></canvas
              ><div class="chart-empty" id="timeEmpty"
                >Ajoutez ou chargez un signal pour commencer</div
              ><output class="chart-tooltip" id="timeTooltip" hidden></output
            ></div>
          </article>
          <article class="chart-panel spectrum-panel">
            <div class="chart-heading">
              <h2 id="spectrumTitle">Spectre d’amplitude</h2>
              <fieldset class="filter-options spectrum-options">
                <legend class="sr-only">Spectre à afficher</legend>
                <label
                  ><input type="radio" name="spectrum" value="amplitude" checked /><span
                    ><b>Amplitude</b></span
                  ></label
                >
                <label
                  ><input type="radio" name="spectrum" value="phase" /><span
                    ><b>Phase</b></span
                  ></label
                >
              </fieldset>
            </div>
            <div class="chart-stage spectrum-stage" id="spectrumStage"
              ><canvas id="spectrumChart"></canvas
              ><output class="chart-tooltip" id="spectrumTooltip" hidden></output
            ></div>
          </article>
        </div>

        <aside class="signal-workbench" aria-label="Composition et transformée du signal">
          <section class="workbench-section">
            <div class="section-heading"><h2>Transformée</h2></div>
            <fieldset class="filter-options transform-options">
              <legend class="sr-only">Méthode de calcul</legend>
              <label
                ><input type="radio" name="transform" value="fft" /><span><b>FFT</b></span></label
              >
              <label
                ><input type="radio" name="transform" value="rfft" checked /><span
                  ><b>RFFT</b></span
                ></label
              >
            </fieldset>
          </section>
          <section class="workbench-section">
            <div class="section-heading"><h2>Signaux</h2></div>
            <div class="signal-list" id="signalList"></div>
            <div class="signal-actions">
              <button class="secondary-button" id="createSignal" type="button"
                >Créer un signal</button
              >
              <button class="secondary-button" id="loadWav" type="button"
                >Charger un signal WAV</button
              >
            </div>
            <input id="wavInput" type="file" accept=".wav,audio/wav,audio/x-wav" hidden />
            <p class="validation" id="signalError" role="alert"></p>
          </section>

          <section class="workbench-section transform-settings">
            <div class="section-heading"><h2 id="transformTitle">Informations RFFT</h2></div>
            <dl class="transform-info"
              ><div><dt>Points du spectre</dt><dd id="fftPoints">—</dd></div
              ><div><dt>Résolution fréquentielle</dt><dd id="frequencyResolution">—</dd></div
              ><div><dt>Fréquence de Nyquist-Shannon</dt><dd id="nyquistFrequency">—</dd></div></dl
            >
          </section>
          <button class="secondary-button reset-button" id="resetButton" type="button"
            >Réinitialiser</button
          >
        </aside>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@14.8.1/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script type="module" src="../../shared/components/course-header.js"></script>
    <script type="module" src="./scripts/app.js?v=20261106-tds3"></script>
  </body>
</html>
