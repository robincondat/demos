<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Comparez la FFT et la RFFT de signaux réels et explorez leurs spectres d’amplitude et de phase." />
  <title>TDS - Transformée de Fourier réelle</title>
  <link rel="stylesheet" href="../../shared/styles/base.css" />
  <link rel="stylesheet" href="../../shared/styles/theme.css" />
  <link rel="stylesheet" href="../../shared/styles/course-header.css" />
  <link rel="stylesheet" href="./styles/fourier.css" />
</head>
<body>
  <course-header page-title="Transformée de Fourier réelle" course-code="TDS" course-name="Traitement du signal" instructor="Robin Condat"></course-header>
  <main>
    <div class="signal-layout">
      <div class="charts-workspace">
        <article class="chart-panel signal-panel">
          <div class="chart-heading"><h2>Signal composé</h2></div>
          <div class="chart-stage" id="timeStage"><canvas id="timeChart"></canvas><div class="chart-empty" id="timeEmpty">Ajoutez ou chargez un signal pour commencer</div><output class="chart-tooltip" id="timeTooltip" hidden></output></div>
        </article>
        <article class="chart-panel spectrum-panel">
          <div class="chart-heading">
            <h2 id="spectrumTitle">Spectre d’amplitude</h2>
            <fieldset class="filter-options spectrum-options">
              <legend class="sr-only">Spectre à afficher</legend>
              <label><input type="radio" name="spectrum" value="amplitude" checked /><span><b>Amplitude</b></span></label>
              <label><input type="radio" name="spectrum" value="phase" /><span><b>Phase</b></span></label>
            </fieldset>
          </div>
          <div class="chart-stage spectrum-stage" id="spectrumStage"><canvas id="spectrumChart"></canvas><output class="chart-tooltip" id="spectrumTooltip" hidden></output></div>
        </article>
      </div>

      <aside class="signal-workbench" aria-label="Composition et transformée du signal">
        <section class="workbench-section">
          <div class="section-heading"><h2>Transformée</h2></div>
          <fieldset class="filter-options transform-options">
            <legend class="sr-only">Méthode de calcul</legend>
            <label><input type="radio" name="transform" value="fft" /><span><b>FFT</b></span></label>
            <label><input type="radio" name="transform" value="rfft" checked /><span><b>RFFT</b></span></label>
          </fieldset>
        </section>
        <section class="workbench-section">
          <div class="section-heading"><h2>Signaux</h2></div>
          <div class="signal-list" id="signalList"></div>
          <button class="secondary-button add-signal" id="addSignal" type="button">+ Ajouter une composante</button>
          <p class="validation" id="signalError" role="alert"></p>
        </section>

        <section class="workbench-section transform-settings">
          <div class="section-heading"><h2 id="transformTitle">Informations RFFT</h2></div>
          <dl class="transform-info"><div><dt>Points du spectre</dt><dd id="fftPoints">—</dd></div><div><dt>Résolution fréquentielle</dt><dd id="frequencyResolution">—</dd></div><div><dt>Fréquence de Nyquist-Shannon</dt><dd id="nyquistFrequency">—</dd></div></dl>
        </section>
        <button class="secondary-button reset-button" id="resetButton" type="button">Réinitialiser</button>
      </aside>
    </div>
  </main>
  <template id="signalTemplate">
    <details class="signal-card">
      <summary>
        <i class="signal-color"></i><strong data-summary-code>S1</strong>
        <label class="visibility-toggle" title="Afficher ce signal"><input data-field="visible" type="checkbox" checked /><span>Afficher</span></label>
      </summary>
      <div class="signal-card-content">
        <div class="signal-card-heading"><strong class="signal-identifier" data-card-code>S1</strong><button class="remove-signal" type="button" aria-label="Supprimer ce signal">×</button></div>
        <label class="field full"><span>Définition</span><select data-field="definition"><option value="function">Fonction usuelle</option><option value="wav">Fichier WAV</option><option value="combination">Combinaison de signaux</option></select></label>
        <div class="definition-panel function-definition">
          <label class="field full"><span>Forme</span><select data-field="type"><option value="sine">Sinus</option><option value="cosine">Cosinus</option><option value="square">Carré</option><option value="triangle">Triangulaire</option><option value="gate">Porte</option><option value="step">Échelon</option></select></label>
          <div class="two-fields periodic-fields"><label class="field"><span>Fréquence</span><div class="input-unit"><input data-field="frequency" type="number" min="0" step="0.1" value="10" /><span>Hz</span></div></label><label class="field"><span>Retard / avance</span><div class="input-unit"><input data-field="delay" type="number" step="0.01" value="0" /><span>s</span></div></label></div>
          <div class="two-fields gate-fields" hidden><label class="field"><span>Début de la porte</span><div class="input-unit"><input data-field="gateStart" type="number" step="0.01" value="0.25" /><span>s</span></div></label><label class="field"><span>Fin de la porte</span><div class="input-unit"><input data-field="gateEnd" type="number" step="0.01" value="0.75" /><span>s</span></div></label></div>
          <div class="two-fields common-fields"><label class="field"><span>Amplitude</span><input data-field="amplitude" type="number" step="0.1" value="1" /></label><label class="field"><span>Offset</span><input data-field="offset" type="number" step="0.1" value="0" /></label></div>
        </div>
        <div class="definition-panel wav-definition" hidden>
          <label class="wav-drop"><input data-field="wavFile" type="file" accept=".wav,audio/wav,audio/x-wav" /><strong>Choisir un fichier WAV</strong><span data-wav-name>Aucun fichier chargé</span></label>
          <div class="two-fields common-fields"><label class="field"><span>Amplitude</span><input data-field="amplitude" type="number" step="0.1" value="1" /></label><label class="field"><span>Offset</span><input data-field="offset" type="number" step="0.1" value="0" /></label></div>
        </div>
        <div class="definition-panel combination-definition" hidden>
          <label class="field full"><span>Expression</span><input data-field="expression" type="text" placeholder="S1 + S2 * S3" /></label>
          <p class="expression-help" data-expression-help>Utilisez les signaux précédents avec +, −, * et des parenthèses.</p>
        </div>
        <label class="field full sampling-rate-field"><span>Fréquence d’échantillonnage</span><div class="input-unit"><input data-field="sampleRate" type="number" min="0.001" step="1" value="1000" /><span>Hz</span></div></label>
        <div class="two-fields interval-fields"><label class="field"><span>Début du signal</span><div class="input-unit"><input data-field="start" type="number" step="0.01" value="0" /><span>s</span></div></label><label class="field"><span>Fin du signal</span><div class="input-unit"><input data-field="end" type="number" step="0.01" value="1" /><span>s</span></div></label></div>
      </div>
    </details>
  </template>
  <script type="module" src="../../shared/components/course-header.js"></script>
  <script type="module" src="./scripts/app.js?v=20261012"></script>
</body>
</html>
